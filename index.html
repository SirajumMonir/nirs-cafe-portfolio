<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nir's Cafe - 3D AI/ML Portfolio | Sirajum Monir</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for retro-cyberpunk look -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Three.js (r128) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- GSAP for smooth cinematic camera movements -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <!-- React & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel compiler for inline JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #05070c;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      user-select: none;
    }
    
    .font-cyber {
      font-family: 'Orbitron', sans-serif;
    }
    
    .font-mono-tech {
      font-family: 'Share Tech Mono', monospace;
    }

    /* Custom premium scrollbar for glassmorphic cards */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.3);
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(0, 242, 254, 0.4);
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 242, 254, 0.8);
    }

    /* Ambient neon glow animations */
    @keyframes neonPulseCyan {
      0%, 100% { filter: drop-shadow(0 0 5px rgba(0, 242, 254, 0.8)) drop-shadow(0 0 15px rgba(0, 242, 254, 0.4)); }
      50% { filter: drop-shadow(0 0 10px rgba(0, 242, 254, 1)) drop-shadow(0 0 25px rgba(0, 242, 254, 0.6)); }
    }
    @keyframes neonPulseAmber {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.7)) drop-shadow(0 0 10px rgba(245, 158, 11, 0.3)); }
      50% { filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.9)) drop-shadow(0 0 20px rgba(245, 158, 11, 0.5)); }
    }
    
    .neon-cyan {
      animation: neonPulseCyan 3s infinite;
    }
    .neon-amber {
      animation: neonPulseAmber 4s infinite;
    }

    /* Scanning lines CRT overlay effect */
    .crt-overlay {
      position: relative;
      overflow: hidden;
    }
    .crt-overlay::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 5;
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
    }

    /* Premium glass backdrop filter fallback helper */
    .glass-morphic {
      background: rgba(4, 6, 10, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 242, 254, 0.15);
    }
  </style>
</head>
<body>
  <!-- Root entry for React app -->
  <div id="root" class="w-full h-full"></div>

  <script type="text/babel" data-type="module" src="./portfolioData.js"></script>
  <script type="text/babel" data-type="module" src="./app.js"></script>
</body>
</html>
